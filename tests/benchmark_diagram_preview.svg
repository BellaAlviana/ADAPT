  <path d="M 1290 894 L 1290 930" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <!-- Initial Node (Solid Black Circle) -->
  <g><title>Initial Node (Titik Mulai)</title><circle cx="170" cy="83" r="12" fill="#000000" stroke="#000000" stroke-width="1" /></g>
  <text x="170" y="64" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">Mulai</text>
  <!-- Action Node -->
  <rect x="80" y="156" width="180" height="50" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
