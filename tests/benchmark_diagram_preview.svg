  <text x="1290" y="779.5" text-anchor="middle" fill="#000000" font-size="11" font-weight="500">Merakit Kedua</text>
  <text x="1290" y="794.5" text-anchor="middle" fill="#000000" font-size="11" font-weight="500">Komponen</text>
  <!-- Action Node -->
  <rect x="1200" y="844" width="180" height="50" rx="10" ry="10" fill="#ffffff" stroke="#000000" stroke-width="1.3" />
  <text x="1290" y="865.5" text-anchor="middle" fill="#000000" font-size="11" font-weight="500">Menghasilkan Produk</text>
  <text x="1290" y="880.5" text-anchor="middle" fill="#000000" font-size="11" font-weight="500">Final</text>
  <!-- Final Node (Bullseye) -->
  <g><title>Activity Final Node (Titik Selesai Alur)</title><circle cx="1290" cy="944" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4" /><circle cx="1290" cy="944" r="7.5" fill="#000000" /></g>
  <text x="1290" y="974" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">Selesai</text>
</svg>