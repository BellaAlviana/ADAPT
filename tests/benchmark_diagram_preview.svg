<svg viewBox="0 0 1460 1008" width="1460" height="1008" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; display: block; margin: 0 auto;">
