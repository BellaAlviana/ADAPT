  <text x="1010" y="524.5" text-anchor="middle" fill="#000000" font-size="11" font-weight="500">Mengirim Komponen Ke</text>
  <text x="1010" y="539.5" text-anchor="middle" fill="#000000" font-size="11" font-weight="500">Titik Perakitan</text>
